[project]
name = "bankml"
version = "2.0.0"
description = "Predicción de depósito a plazo (LightGBM) servida como Vercel Function"
# El .joblib sólo es compatible con las versiones con que se serializó: Python 3.12.
requires-python = "==3.12.*"
# Mantener sincronizado con requirements.txt (que usan el README y los tests locales).
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.4",
  "lightgbm==4.5.0",
  "scikit-learn==1.5.2",
  "pandas==2.2.3",
  "numpy==2.1.3",
  "scipy==1.14.1",
  "joblib==1.4.2",
  "psycopg[binary]==3.2.3",
]
